name: Validate Neovim config

# Verifies that the Neovim config is syntactically valid and loads cleanly.
on:
  push:
    paths:
      - "init.lua"
      - "lua/**"
      - "lazy-lock.json"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "init.lua"
      - "lua/**"
      - "lazy-lock.json"
      - ".github/workflows/validate.yml"
  workflow_dispatch: {}

jobs:
  lua-syntax:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT (Neovim's Lua runtime)
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Parse all Lua files (fails on syntax errors)
        run: |
          err=0
          while IFS= read -r f; do
            if luajit -e "assert(loadfile([[$f]]))"; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              err=1
            fi
          done < <(find init.lua lua -name '*.lua')
          [ "$err" -eq 0 ] && echo "All Lua files parsed OK"
          exit "$err"

  nvim-load:
    name: Headless Neovim load
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Print Neovim version
        run: nvim --version | head -1

      - name: Load config as XDG config and install plugins
        run: |
          set -e
          export XDG_CONFIG_HOME="$PWD/.ci/config"
          export XDG_DATA_HOME="$PWD/.ci/data"
          export XDG_STATE_HOME="$PWD/.ci/state"
          export XDG_CACHE_HOME="$PWD/.ci/cache"
          mkdir -p "$XDG_CONFIG_HOME/nvim"
          cp init.lua "$XDG_CONFIG_HOME/nvim/init.lua"
          # Copy the whole module tree so require("config.*") / require("plugins.*") resolve.
          [ -d lua ] && cp -r lua "$XDG_CONFIG_HOME/nvim/lua"
          [ -f lazy-lock.json ] && cp lazy-lock.json "$XDG_CONFIG_HOME/nvim/lazy-lock.json" || true

          # Install/resolve every plugin spec synchronously.
          nvim --headless "+Lazy! sync" +qa 2>&1 | tee /tmp/lazy.log || true

          # Start once more and capture any Lua/startup errors.
          nvim --headless "+qa" 2> /tmp/load.log || true
          echo "----- startup stderr -----"
          cat /tmp/load.log || true

          if grep -qiE "E[0-9]+:|Error executing|stack traceback|attempt to (index|call)|module '.*' not found" /tmp/load.log; then
            echo "::error::Neovim config produced errors on load"
            exit 1
          fi
          echo "Config loaded cleanly"
