name: Validate Vim config
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  vim-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vim
        run: sudo apt-get update && sudo apt-get install -y vim-nox
      - name: Validate modules and behaviours
        run: sh scripts/validate.sh
